[package]
name = "rwa-service"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["json"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
futures = "0.3"
prost-types = "0.13"
rdkafka = { version = "0.36", features = ["cmake-build", "ssl", "sasl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

prometheus = "0.13"
chrono = { version = "0.4", features = ["serde"] }

solana-client = "2.1.0"
solana-sdk = "2.1.0"
spl-associated-token-account = "4.0.0"
spl-token = "6.0.0"

rwa-proto = { path = "../proto" }

